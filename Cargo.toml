[package]
name = "media_compress"
version = "0.1.0"
edition = "2021"

[lib]
name = "media_compress"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
thiserror = "2"
anyhow = "1"
# GIF codec: decode + re-encode as GIF (all platforms, including wasm).
# quantette is MIT/Apache-2.0; zengif's default `zenquant` quantizer is
# AGPL-3.0-or-later, so it is deliberately not enabled.
zengif = { version = "0.7.3", default-features = false, features = [
    "std",
    "quantette",
] }

# libwebp is not used on WASM — static WebP encoding is delegated to the
# browser Canvas API.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webp = { version = "0.3", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "OffscreenCanvas",
    "ImageEncodeOptions",
    "Blob",
    "ImageBitmap",
    "ImageBitmapRenderingContext",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# codec comparison benches (examples/codec_bench.rs, examples/gif_zengif_bench.rs)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zenwebp = "0.4.4"
libwebp-sys = "0.9"
# The extra quantizers exist only for the GIF bench's comparison rows; the
# library itself builds zengif with `quantette` only.
zengif = { version = "0.7.3", default-features = false, features = [
    "std",
    "zenquant",
    "quantette",
    "quantizr",
    "color_quant",
    "imagequant",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "bmp",
    "tiff",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Optimize even in debug builds: compression time is dominated by pixel loops
# in this crate (resize / EXIF orientation / BGRA->RGBA) and by the libwebp C
# sources, all far slower at opt-level 0 / -O0. Debug info is unaffected.
[profile.dev]
opt-level = 2
