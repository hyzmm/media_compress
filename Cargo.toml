[package]
name = "media_compress"
version = "0.1.0"
edition = "2021"

[lib]
name = "media_compress"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
thiserror = "2"
anyhow = "1"

[features]
# Encode WebP in wasm with the pure-Rust zenwebp encoder instead of the
# browser canvas encoder. Build with:
#   wasm-pack build --release -- --features web-zenwebp
web-zenwebp = ["dep:zenwebp"]

# libwebp is not used on WASM — encoding is delegated to the browser Canvas API
# (or to the zenwebp crate behind the `web-zenwebp` feature).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webp = { version = "0.3", default-features = false }
# Used directly for animated WebP encoding (WebPAnimEncoder), where the `webp`
# crate's wrapper cannot express the animation end timestamp.
libwebp-sys = "0.9"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
# Optional pure-Rust WebP encoder, enabled by the `web-zenwebp` feature.
zenwebp = { version = "=0.4.4", optional = true }
web-sys = { version = "0.3", features = [
    "OffscreenCanvas",
    "OffscreenCanvasRenderingContext2d",
    "ImageEncodeOptions",
    "ImageData",
    "Blob",
    "ImageBitmap",
    "Window",
    "ImageBitmapRenderingContext",
    "VideoFrame",
] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk-context = "0.1"

# codec comparison bench (examples/codec_bench.rs)
[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
zenwebp = "0.4.4"
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "bmp",
    "tiff",
] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["console"] }

# Compile libwebp C sources with optimizations even in debug builds.
# Without this, libwebp runs at -O0 and is ~20x slower than release.
[profile.dev.package.libwebp-sys]
opt-level = 2
